name: Vigilar webs

on:
  schedule:
    # Cada 30 minutos
    - cron: "*/30 * * * *"

  # Permite ejecutarlo manualmente
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar webs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_sites.py

      - name: Guardar cambios en el repo
        run: |
          git config user.name "website-watcher-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/data

          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Actualiza historial de vigilancia $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
